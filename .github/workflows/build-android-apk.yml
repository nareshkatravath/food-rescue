name: Build Downloadable Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build portable web bundle
        env:
          VITE_BASE_PATH: ./
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Initialize Capacitor Android project
        env:
          CI: true
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx --yes cap add android
          npx --yes cap sync android
          node scripts/generate-android-icons.mjs
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_SDK" > android/local.properties
          if [ -x "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FoodRescue.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodRescue-android-apk
          path: FoodRescue.apk

      - name: Publish Latest Android APK Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest FoodRescue.apk \
            --target "${{ github.sha }}" \
            --title "FoodRescue Android APK (Build #${{ github.run_number }})" \
            --notes "Download **FoodRescue.apk** below and open it on your Android device to install." \
            --latest

      - name: Attach APK to Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" FoodRescue.apk --clobber 2>/dev/null || \
          gh release create "${{ github.ref_name }}" FoodRescue.apk \
            --title "FoodRescue ${{ github.ref_name }}" \
            --generate-notes \
            --latest
