name: Build Downloadable Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build portable web bundle
        env:
          VITE_BASE_PATH: ./
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Initialize Capacitor Android project
        env:
          CI: true
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx --yes cap add android
          npx --yes cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FoodRescue.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodRescue-android-apk
          path: FoodRescue.apk

      - name: Publish Latest Android APK Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FoodRescue Android APK (Latest)
          body: |
            Download **FoodRescue.apk** below and open it on your Android device to install.
          files: FoodRescue.apk
          make_latest: true

      - name: Attach APK to Version Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FoodRescue.apk
          generate_release_notes: true
          make_latest: true
